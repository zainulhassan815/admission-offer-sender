name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest        # free for public repositories
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build
        run: >
          uv run --with pyinstaller pyinstaller
          --name "Admission Offer Sender"
          --onefile --noconsole --clean --noconfirm
          --add-data "templates;templates"
          --add-data "static;static"
          --add-data "offer-letter.docx;."
          --collect-data docx
          app.py

      - name: Smoke test
        run: |
          $env:NO_BROWSER = "1"; $env:PORT = "8899"
          $p = Start-Process -PassThru "dist/Admission Offer Sender.exe"
          Start-Sleep -Seconds 20
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:8899/" -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "app did not serve the page" }
          Invoke-WebRequest -Method POST -Uri "http://127.0.0.1:8899/quit" -UseBasicParsing | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: admission-offer-sender-windows
          path: dist/Admission Offer Sender.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Admission Offer Sender.exe
